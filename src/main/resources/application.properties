spring.application.name=04_tutor_personalizado
server.port=8004

# Ollama local
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=llama3
spring.ai.ollama.embedding.options.model=bge-m3

# Qdrant
spring.ai.vectorstore.qdrant.host=localhost
spring.ai.vectorstore.qdrant.port=6334
spring.ai.vectorstore.qdrant.collection-name=tutor
spring.ai.vectorstore.qdrant.initialize-schema=true

# Carpeta con los tutoriales PDF
app.docs.path=docs
spring.ai.ollama.chat.options.temperature=0.2
# contexto ampliado para que quepan los chunks recuperados
spring.ai.ollama.chat.options.num-ctx=8192
